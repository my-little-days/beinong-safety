<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#fff8ee"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>農一期新場域｜安全與使用指南</title><style>
:root{--ink:#173e4b;--teal:#215c66;--paper:#fff9ef;--line:#e9dccb}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}.app{max-width:680px;margin:auto;min-height:100dvh;background:radial-gradient(ellipse at 96% 0%,#fff0d8,transparent 40%),#fff9ef;padding-bottom:calc(86px + env(safe-area-inset-bottom))}.hero{position:relative}.hero img{display:block;width:100%}.hit{position:absolute;background:transparent;border:0;cursor:pointer;touch-action:manipulation}.hit:focus-visible{outline:3px solid #0b7777}.content{padding:18px 16px 30px}.top{display:flex;gap:12px;align-items:center;margin:4px 0 12px}.back{background:transparent;border:0;font-size:28px;color:var(--ink);padding:4px 8px}.title{font-size:25px;margin:0;font-weight:800}.subtitle{font-size:13px;line-height:1.6;margin:0 0 18px;color:#647c80}.section{margin:18px 0 9px;background:linear-gradient(100deg,#24677d,#276177);color:#fff;border-radius:12px;padding:12px 16px;font-size:19px;font-weight:800}.item{border:1px solid #e6d9c7;background:#fffdfa;border-radius:16px;margin:9px 0;overflow:hidden;box-shadow:0 3px 8px #765b3210}.toggle{display:flex;align-items:center;width:100%;border:0;background:transparent;padding:15px 12px;gap:9px;color:var(--ink);text-align:left;font-size:15px;font-weight:700;cursor:pointer}.emoji{font-size:21px}.label{flex:1}.action{white-space:nowrap;font-size:12px;color:#265b6d;font-weight:700}.pic{display:none;padding:0 10px 12px}.item.expanded .pic{display:block}.pic img{display:block;width:100%;height:auto;border-radius:10px}.shortcuts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 20px}.shortcut{border:1px solid var(--line);border-radius:17px;background:#fffcf6;padding:15px 8px;text-align:center;color:var(--ink);font-weight:750;font-size:15px;box-shadow:0 2px 8px #0000000b}.shortcut .sym{display:block;font-size:31px;margin-bottom:7px}.notice{background:#fff;border:1px solid var(--line);padding:17px;border-radius:16px;line-height:1.8}.nav{position:fixed;z-index:8;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,680px);display:grid;grid-template-columns:repeat(5,1fr);gap:1px;padding:8px 5px calc(9px + env(safe-area-inset-bottom));background:#fffdf8;border:1px solid #eadfcd;border-radius:23px 23px 0 0;box-shadow:0 -3px 18px #64502a16}.nav button{border:0;background:transparent;border-radius:18px;color:#254750;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;min-height:52px;font-size:11px;font-weight:750;padding:4px 1px}.nav button.current{background:#d9f0e6;color:#075c59}.nav .ni{font-size:25px;line-height:1.1}.listlink{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:#fffdfa;padding:18px 13px;border-radius:17px;margin:10px 0;font-weight:750;cursor:pointer;width:100%;text-align:left;color:var(--ink);font-size:16px}.listlink .grow{flex:1}.placeholder{border:2px dashed #c9d5cf;background:#fffefa;border-radius:18px;padding:24px;text-align:center;line-height:1.8;color:#567074}@media(min-width:650px){.content{padding:25px 30px}.toggle{font-size:17px}.action{font-size:14px}}

.illustration{display:inline-block;width:27px;height:27px;vertical-align:middle;flex-shrink:0;stroke:#14666a;filter:drop-shadow(1px 2px 0 #f4b35a55)}
.section .illustration{stroke:#fff;width:25px;height:25px;filter:none;margin-right:5px}
.section{display:flex;align-items:center;gap:6px;background:linear-gradient(100deg,#275d6b,#286c77);box-shadow:0 4px 9px #3a5b5b22}
.shortcut .illustration{width:43px;height:43px;stroke:#12665d;stroke-width:1.5}
.emoji{display:inline-flex;align-items:center;justify-content:center;min-width:36px;height:36px;border-radius:10px;background:#fff3df}
.nav .ni{display:flex;align-items:center;justify-content:center}
.nav .illustration{width:25px;height:25px;filter:none;stroke:#1d424a}
.nav .current .illustration{stroke:#12605c}
.top{position:relative;padding:8px 0 5px}.top:after{content:'✳';color:#f48b2b;position:absolute;right:9px;font-size:24px;top:8px}
.title{letter-spacing:.035em}.content{background:radial-gradient(circle at 98% 0%,#ffe9ca 0,transparent 28%),#fff9ef;min-height:calc(100dvh - 75px)}
.item{box-shadow:0 3px 7px #866b4b17}.toggle{min-height:66px}.toggle:active,.listlink:active,.shortcut:active{background:#f5f0e8}
.pic img{border:1px solid #efe4d4}.listlink .illustration{width:35px;height:35px}.listlink{box-shadow:0 3px 8px #866b4b16}
.hero{background:#fff9ef}.hero img{max-width:100%;height:auto}
@media(min-width:650px){.hero{max-width:550px;margin:auto}}
</style></head><body><main class="app"><div id="main"></div></main><nav class="nav" id="nav" aria-label="底部導覽"></nav><script>
const items=[["B1機車停車場", "交通與車輛", "01", "🛵"], ["消防安全管理", "消防與急救", "02", "🧯"], ["客梯與貨梯", "場域設施", "03", "🏬"], ["B1及2樓冷藏庫", "場域設施", "04", "🏬"], ["AED設置及消防編組", "消防與急救", "05", "🧯"], ["3樓電動搬運車停車場", "交通與車輛", "06", "🏬"], ["1樓零批場及拍賣場動線", "交通與車輛", "07", "🚚"], ["汽車停車場", "交通與車輛", "08", "🚚"], ["作業機具與視線死角", "作業安全", "09", "🏬"], ["B1有機垃圾處理場", "場域設施", "10", "🏬"], ["用電安全宣導", "作業安全", "11", "⚡"], ["逃生門注意事項", "消防與急救", "12", "🧯"], ["攤位用電與貨物堆放", "作業安全", "13", "⚡"], ["人車分道注意事項", "交通與車輛", "14", "🚶"], ["AED注意事項", "消防與急救", "15", "🧯"]];const sections=[["場域設施", "🏬", ["03", "10", "04"]], ["停車與動線", "🚚", ["01", "08", "06", "07", "14", "09"]], ["消防與緊急應變", "🧯", ["05", "15", "12", "02"]], ["用電與堆貨", "⚡", ["11", "13"]]];let page='home';const $=s=>document.querySelector(s);const main=$('#main');const nav=$('#nav');
const navs=[['home','home','首頁'],['guide','map','場域導覽'],['fire','siren','緊急應變'],['all','book','講習教材'],['more','grid','更多']];
const icons={home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',map:'<path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3zM9 3v15M15 6v15"/>',siren:'<path d="M5 17h14l-2-9a5 5 0 0 0-10 0zM3 21h18M12 1v2M3 7 1 6M21 7l2-1"/>',book:'<path d="M12 6c-3-2-6-2-10-1v14c4-1 7-1 10 1 3-2 6-2 10-1V5c-4-1-7-1-10 1zM12 6v14"/>',grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',warehouse:'<path d="m2 10 10-7 10 7v11H2zM7 21v-9h10v9M7 15h10M7 18h10"/>',truck:'<path d="M2 6h12v11H2zM14 10h4l4 4v3h-8z"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/>',forklift:'<path d="M3 16V8h9l3 8M2 16h14M18 4v14h4M18 14h4M6 8v8"/><circle cx="6" cy="19" r="2"/><circle cx="14" cy="19" r="2"/>',extinguisher:'<path d="M9 7h6l2 3v11H7V10zM12 7V3h5M17 3l3 2M9 13h6"/>',bolt:'<path d="m13 2-9 12h7l-1 8 10-13h-7z"/>',scooter:'<circle cx="5" cy="18" r="3"/><circle cx="19" cy="18" r="3"/><path d="M5 18h8l3-7h3M10 8h4l3 5M8 14l3-4"/>',car:'<path d="M4 12 6 6h12l2 6M3 12h18v6H3z"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>',walk:'<circle cx="13" cy="4" r="2"/><path d="m10 21 2-7-3-3-2 4-4 1M12 14l5 2 3 5M9 11l2-4 5 2 2 4"/>',pin:'<path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0z"/><circle cx="12" cy="10" r="2"/>',aed:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 17 7 12c-3-3 1-6 5-2 4-4 8-1 5 2z"/>'};
function icon(name,cls=''){return `<svg class="illustration ${cls}" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${icons[name]||icons.book}</svg>`}
const itemIcon={'01':'scooter','02':'extinguisher','03':'warehouse','04':'warehouse','05':'aed','06':'forklift','07':'truck','08':'car','09':'forklift','10':'warehouse','11':'bolt','12':'extinguisher','13':'bolt','14':'walk','15':'aed'};

function navDraw(){nav.innerHTML=navs.map(([id,iconName,title])=>`<button class="${page===id?'current':''}" onclick="show('${id}')"><span class="ni">${icon(iconName)}</span><span>${title}</span></button>`).join('')}
function header(t,desc=''){return `<div class="top"><button class="back" onclick="show('home')" aria-label="返回首頁">←</button><h1 class="title">${t}</h1></div>${desc?`<p class="subtitle">${desc}</p>`:''}`}
function makeItem(x){return `<div class="item"><button class="toggle" aria-expanded="false" onclick="toggle(this)"><span class="emoji">${icon(itemIcon[x[2]])}</span><span class="label">${x[0]}</span><span class="action">點開查看 ＋</span></button><div class="pic"><img loading="lazy" src="images/card-${x[2]}.jpg" alt="${x[0]}完整講習圖卡" onerror="this.replaceWith(Object.assign(document.createElement('p'),{textContent:'圖片載入失敗，請確認 images 資料夾已上傳。'}))"></div></div>`}
function toggle(b){let p=b.parentElement,open=p.classList.toggle('expanded');b.setAttribute('aria-expanded',open);b.querySelector('.action').textContent=open?'收合 −':'點開查看 ＋'}
function group(s){return `<div class="section" id="s${s[2][0]}">${icon(({"場域設施":"warehouse","停車與動線":"truck","消防與緊急應變":"extinguisher","用電與堆貨":"bolt"})[s[0]])} ${s[0]}</div>${s[2].map(id=>makeItem(items.find(x=>x[2]===id))).join('')}`}
function show(key){page=key;navDraw();if(key==='home'){main.innerHTML=`<div class="hero"><img src="home-top.jpg" alt="北農農一期新場域安全與使用指南首頁"><button class="hit" style="left:3%;top:39%;width:31%;height:24%" aria-label="場域導覽" onclick="show('guide')"></button><button class="hit" style="left:35%;top:39%;width:31%;height:24%" aria-label="場域設施" onclick="show('facilities')"></button><button class="hit" style="left:67%;top:39%;width:31%;height:24%" aria-label="交通與車輛" onclick="show('transport')"></button><button class="hit" style="left:3%;top:67%;width:31%;height:27%" aria-label="作業安全" onclick="show('work')"></button><button class="hit" style="left:35%;top:67%;width:31%;height:27%" aria-label="消防與急救" onclick="show('fire')"></button><button class="hit" style="left:67%;top:67%;width:31%;height:27%" aria-label="講習教材" onclick="show('all')"></button></div>`}else if(key==='all'){main.innerHTML=`<div class="content">${header('📖 講習教材','依主題分類，點選項目即可閱讀完整圖卡。')}<div class="shortcuts">${sections.map((s,i)=>`<button class="shortcut" onclick="document.getElementById('s${s[2][0]}').scrollIntoView({behavior:'smooth',block:'start'})"><span class="sym">${icon(({"場域設施":"warehouse","停車與動線":"truck","消防與緊急應變":"extinguisher","用電與堆貨":"bolt"})[s[0]])}</span>${s[0]}</button>`).join('')}</div>${sections.map(group).join('')}</div>`}else if(['facilities','transport','work','fire'].includes(key)){const indices={facilities:[0],transport:[1],work:[1,3],fire:[2]};const titles={facilities:'場域設施',transport:'交通與車輛',work:'作業安全',fire:'消防與緊急應變'};const chosen=indices[key];main.innerHTML=`<div class="content">${header(titles[key],'點開查看完整原始圖卡。')}${chosen.map(i=>key==='work'?`${i===1?'':`<div class="section">${icon('forklift')} 作業安全</div>`}${sections[i][2].filter(id=>['09','11','13'].includes(id)).map(id=>makeItem(items.find(x=>x[2]===id))).join('')}`:group(sections[i])).join('')}</div>`}else if(key==='guide'){main.innerHTML=`<div class="content">${header('🗺️ 場域導覽','樓層配置、出入口、重要位置與動線圖。')}<button class="listlink" onclick="guideDetail('樓層配置與出入口')">${icon('map')} <span class="grow">樓層配置與出入口</span>›</button><button class="listlink" onclick="guideDetail('重要位置總覽')">${icon('pin')} <span class="grow">重要位置總覽</span>›</button><button class="listlink" onclick="guideDetail('貨車動線（動畫）')">${icon('truck')} <span class="grow">貨車動線（動畫）</span>›</button><button class="listlink" onclick="guideDetail('人車分道示意')">${icon('walk')} <span class="grow">人車分道示意</span>›</button><button class="listlink" onclick="guideDetail('重點場域導覽')">${icon('pin')} <span class="grow">重點場域導覽</span>›</button></div>`}else if(key==='more'){main.innerHTML=`<div class="content">${header('更多')}<div class="notice">農一期新場域安全與使用指南。<p>各項安全規範以公司正式公告及現場指示為準。</p><p>更新內容後可沿用原 GitHub Pages 網址與 QR Code。</p></div></div>`}window.scrollTo(0,0)}
function guideDetail(t){main.innerHTML=`<div class="content">${header(t)}<div class="placeholder">📍<br>此區已預留位置<br>待正式場域導覽圖、動線圖或動畫確認後加入。</div></div>`;window.scrollTo(0,0)}show('home');
</script></body></html>
