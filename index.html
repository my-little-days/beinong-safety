<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff7ea"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>農一期新場域｜安全與使用指南</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff9ef;color:#222;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif}.home{width:100%;max-width:768px;margin:0 auto;position:relative}.home img{display:block;width:100%;height:auto}.hot{position:absolute;border:0;background:transparent;cursor:pointer;border-radius:14px;touch-action:manipulation}.hot:focus-visible{outline:4px solid #147d82;outline-offset:-4px}.panel{display:none;max-width:768px;margin:0 auto;min-height:100vh;padding:15px 16px 90px;background:#fff9ef}.panel.on{display:block}.panel-head{display:flex;align-items:center;gap:12px;position:sticky;top:0;background:#fff9ef;padding:8px 0 16px;z-index:2}.back{border:0;background:#e1f1e9;color:#135f55;border-radius:12px;padding:12px;font-weight:700;font-size:17px}.panel h1{font-size:24px;margin:0}.note{background:#fff;border:1px solid #e5dbcc;padding:16px;border-radius:15px;line-height:1.7}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{border:1px solid #e9dccd;background:#fff;border-radius:16px;padding:7px;box-shadow:0 3px 8px #0001;text-align:left;color:#222}.card img{width:100%;height:190px;object-fit:contain}.card span{display:block;font-size:14px;font-weight:700;padding:8px}.viewer{display:none;position:fixed;inset:0;z-index:9;background:#111e;color:#fff;overflow:auto}.viewer.on{display:block}.viewer button{position:sticky;top:0;z-index:10;padding:15px;border:0;background:#fff;color:#222;border-radius:0 0 12px 0;font-size:17px}.viewer img{display:block;width:100%;max-width:1000px;margin:auto;height:auto}.viewer-title{padding:12px;text-align:center}.fallback{display:none;padding:14px;color:#a23}.category-list{display:grid;gap:12px}.category{border:1px solid #e6d9c7;background:#fffefa;border-radius:20px;overflow:hidden;box-shadow:0 4px 12px #3c34220d}.category summary{list-style:none;display:flex;align-items:center;gap:12px;padding:16px 14px;cursor:pointer;font-size:18px;font-weight:800;color:#183f42;min-height:74px}.category summary::-webkit-details-marker{display:none}.category summary:after{content:'＋';margin-left:auto;font-size:24px;color:#b57632}.category[open] summary:after{content:'－'}.category-icon{display:grid;place-items:center;width:48px;height:48px;border-radius:14px;font-size:25px;background:#f1f5e6;flex-shrink:0}.category:nth-child(2) .category-icon{background:#fff0dc}.category:nth-child(3) .category-icon{background:#eaf3f8}.category:nth-child(4) .category-icon{background:#fcebe6}.category-sub{display:block;color:#777;font-size:12px;font-weight:500;margin-top:4px}.category .cards{padding:4px 12px 14px}.category .card img{height:170px}.category .card span{line-height:1.4}.intro{font-size:14px;line-height:1.7;color:#55615e;margin:0 0 16px;padding:12px 14px;border-radius:14px;background:#fff;border:1px solid #e9dfd3}.panel-head{z-index:4}@media(max-width:380px){.category .card img{height:140px}}@media(min-width:600px){.card img{height:240px}}
</style></head><body><div class="home" id="home"><img src="home-design.jpg" alt="北農農一期新場域安全與使用指南，六大主題入口"><button class="hot" style="left:3%;top:33.5%;width:31%;height:24%" aria-label="場域導覽" onclick="openPage('guide')"></button><button class="hot" style="left:35%;top:33.5%;width:31%;height:24%" aria-label="場域設施" onclick="openPage('facilities')"></button><button class="hot" style="left:67%;top:33.5%;width:31%;height:24%" aria-label="交通與車輛" onclick="openPage('transport')"></button><button class="hot" style="left:3%;top:58.5%;width:31%;height:24%" aria-label="作業安全" onclick="openPage('work')"></button><button class="hot" style="left:35%;top:58.5%;width:31%;height:24%" aria-label="消防與急救" onclick="openPage('fire')"></button><button class="hot" style="left:67%;top:58.5%;width:31%;height:24%" aria-label="講習教材" onclick="openPage('all')"></button><button class="hot" style="left:2%;top:87%;width:19%;height:11%" aria-label="首頁" onclick="openPage('home')"></button><button class="hot" style="left:21%;top:87%;width:19%;height:11%" aria-label="講習教材" onclick="openPage('all')"></button><button class="hot" style="left:40%;top:87%;width:19%;height:11%" aria-label="場域導覽" onclick="openPage('guide')"></button><button class="hot" style="left:59%;top:87%;width:20%;height:11%" aria-label="緊急應變" onclick="openPage('fire')"></button><button class="hot" style="left:79%;top:87%;width:20%;height:11%" aria-label="更多" onclick="openPage('more')"></button></div><section class="panel" id="panel"><div class="panel-head"><button class="back" onclick="openPage('home')">← 首頁</button><h1 id="heading"></h1></div><div class="note" id="note" hidden></div><div class="category-list" id="categories"></div><div class="cards" id="cards"></div></section><div class="viewer" id="viewer"><button onclick="closeImage()">← 返回圖卡</button><div class="viewer-title" id="viewerTitle"></div><img id="big" alt="安全宣導圖卡"></div><script>
const data=[{"title": "B1機車停車場", "cat": "場域設施", "src": "images/card-01.jpg"}, {"title": "消防安全管理", "cat": "消防與急救", "src": "images/card-02.jpg"}, {"title": "客貨梯使用說明", "cat": "場域設施", "src": "images/card-03.jpg"}, {"title": "冷藏庫說明", "cat": "場域設施", "src": "images/card-04.jpg"}, {"title": "AED設置與消防演習", "cat": "消防與急救", "src": "images/card-05.jpg"}, {"title": "3樓電動搬運車停車場", "cat": "交通與車輛", "src": "images/card-06.jpg"}, {"title": "零批場與拍賣場動線", "cat": "交通與車輛", "src": "images/card-07.jpg"}, {"title": "汽車停車場", "cat": "交通與車輛", "src": "images/card-08.jpg"}, {"title": "作業機具與視線死角", "cat": "作業安全", "src": "images/card-09.jpg"}, {"title": "有機垃圾處理場", "cat": "場域設施", "src": "images/card-10.jpg"}, {"title": "用電安全宣導", "cat": "作業安全", "src": "images/card-11.jpg"}, {"title": "逃生門注意事項", "cat": "消防與急救", "src": "images/card-12.jpg"}, {"title": "攤位用電與貨物堆放", "cat": "作業安全", "src": "images/card-13.jpg"}, {"title": "人車分道注意事項", "cat": "交通與車輛", "src": "images/card-14.jpg"}, {"title": "AED注意事項", "cat": "消防與急救", "src": "images/card-15.jpg"}];const pages={facilities:['場域設施',['場域設施']],transport:['交通與車輛',['交通與車輛']],work:['作業安全',['作業安全']],fire:['消防與急救',['消防與急救']],all:['講習教材',['場域設施','交通與車輛','作業安全','消防與急救']],guide:['場域導覽',[]],more:['更多',[]]};const categoryInfo={'場域設施':['🏬','客貨梯・冷藏庫・垃圾處理・停車場'],'交通與車輛':['🚚','人車分道・停車管理・車輛動線'],'作業安全':['⚠️','用電安全・貨物堆放・視線死角'],'消防與急救':['🧯','滅火器・逃生門・AED・緊急應變']};
function makeCard(x){const b=document.createElement('button');b.className='card';b.type='button';const im=document.createElement('img');im.src=x.src;im.alt=x.title;im.loading='lazy';const label=document.createElement('span');label.textContent=x.title;b.append(im,label);b.onclick=()=>{document.getElementById('big').src=x.src;document.getElementById('viewerTitle').textContent=x.title;document.getElementById('viewer').classList.add('on');document.body.style.overflow='hidden'};return b}
function openPage(key){const home=document.getElementById('home'),panel=document.getElementById('panel');if(key==='home'){home.style.display='block';panel.classList.remove('on');window.scrollTo(0,0);return}home.style.display='none';panel.classList.add('on');const [title,cats]=pages[key];document.getElementById('heading').textContent=title;const cards=document.getElementById('cards'),note=document.getElementById('note'),groups=document.getElementById('categories');cards.innerHTML='';groups.innerHTML='';note.hidden=true;cards.style.display='none';if(key==='guide'){note.hidden=false;note.textContent='場域導覽、樓層配置、出入口動線圖及重要位置：待公司確認正式圖面後補充。'}else if(key==='more'){note.hidden=false;note.textContent='農一期新場域安全與使用指南。安全資料依公司正式公告及現場指示為準。更新沿用原網址與 QR Code。'}else{const intro=document.createElement('p');intro.className='intro';intro.textContent='請點選下方分類展開講習圖卡，再點選圖片即可放大閱讀。';groups.append(intro);cats.forEach(cat=>{const list=data.filter(x=>x.cat===cat);if(!list.length)return;const d=document.createElement('details');d.className='category';const summary=document.createElement('summary');const ico=document.createElement('span');ico.className='category-icon';ico.textContent=categoryInfo[cat][0];const txt=document.createElement('span');txt.textContent=cat;const sub=document.createElement('small');sub.className='category-sub';sub.textContent=categoryInfo[cat][1]+'｜'+list.length+' 張';txt.append(sub);summary.append(ico,txt);const grid=document.createElement('div');grid.className='cards';list.forEach(x=>grid.append(makeCard(x)));d.append(summary,grid);groups.append(d)});if(key!=='all'&&groups.querySelector('details'))groups.querySelector('details').open=true}window.scrollTo(0,0)}
function closeImage(){document.getElementById('viewer').classList.remove('on');document.body.style.overflow=''}window.addEventListener('keydown',e=>{if(e.key==='Escape')closeImage()});
</script></body></html>
